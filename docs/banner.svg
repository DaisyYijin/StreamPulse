<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1310" />
      <stop offset="0.55" stop-color="#070b09" />
      <stop offset="1" stop-color="#0a0f0d" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(925 92) rotate(133) scale(420 300)">
      <stop stop-color="#c9ff57" stop-opacity="0.16" />
      <stop offset="1" stop-color="#c9ff57" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 300) rotate(-40) scale(380 260)">
      <stop stop-color="#5ce9c7" stop-opacity="0.09" />
      <stop offset="1" stop-color="#5ce9c7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="pulse" x1="810" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c9ff57" stop-opacity="0" />
      <stop offset="0.2" stop-color="#c9ff57" />
      <stop offset="0.7" stop-color="#8ff08b" />
      <stop offset="1" stop-color="#5ce9c7" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#ffffff" stroke-opacity="0.035" />
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)" />
  <rect width="1200" height="320" rx="28" fill="url(#glow)" />
  <rect width="1200" height="320" rx="28" fill="url(#glow2)" />
  <rect width="1200" height="320" rx="28" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="318" rx="27" stroke="#ffffff" stroke-opacity="0.07" />

  <g transform="translate(72 66)">
    <rect width="60" height="60" rx="17" fill="#c9ff57" fill-opacity="0.1" />
    <rect x="0.5" y="0.5" width="59" height="59" rx="16.5" stroke="#c9ff57" stroke-opacity="0.22" />
    <path d="M13 32h7l4-13 7 26 5.5-19 3.5 9H49" stroke="#c9ff57" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="49" cy="27" r="2.6" fill="#c9ff57" />
  </g>

  <text x="150" y="104" fill="#edf3ee" font-family="Inter, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="46" font-weight="650" letter-spacing="-2">Stream<tspan fill="#c9ff57">Pulse</tspan></text>
  <text x="151" y="132" fill="#8b9a94" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="2.6">STRM MEDIA ENGINE</text>

  <text x="72" y="210" fill="#edf3ee" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="600" letter-spacing="-1">让云盘媒体，像本地一样播放。</text>
  <text x="73" y="243" fill="#8b9a94" font-family="Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14">Turn OpenList media into native Emby / Jellyfin STRM libraries.</text>

  <g font-family="Inter, 'PingFang SC', sans-serif" font-size="11">
    <rect x="72" y="272" width="92" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="118" y="289" fill="#a9b7b1" text-anchor="middle">OpenList</text>
    <rect x="174" y="272" width="104" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="226" y="289" fill="#a9b7b1" text-anchor="middle">Emby / Jellyfin</text>
    <rect x="288" y="272" width="76" height="25" rx="12.5" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="326" y="289" fill="#a9b7b1" text-anchor="middle">Docker</text>
    <rect x="374" y="272" width="108" height="25" rx="12.5" fill="#c9ff57" fill-opacity="0.08" stroke="#c9ff57" stroke-opacity="0.2" />
    <text x="428" y="289" fill="#c9ff57" text-anchor="middle">Multi-arch</text>
  </g>

  <g transform="translate(790 0)">
    <rect x="0" y="0" width="350" height="320" fill="url(#glow)" opacity="0.7" />
    <g stroke="#c9ff57" stroke-opacity="0.14" stroke-width="1">
      <path d="M15 246h320M15 188h320M15 130h320M15 72h320" stroke-dasharray="3 8" />
    </g>
    <path d="M20 210h42l14-42 22 86 20-66 16 34 18-28 14 48 20-76 18 52 15-22 18 10 20-30 16 28h36" fill="none" stroke="#c9ff57" stroke-opacity="0.16" stroke-width="10" filter="url(#blur)" />
    <path d="M20 210h42l14-42 22 86 20-66 16 34 18-28 14 48 20-76 18 52 15-22 18 10 20-30 16 28h36" fill="none" stroke="#c9ff57" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="345" cy="191" r="4.6" fill="#c9ff57" />
    <circle cx="345" cy="191" r="10" stroke="#c9ff57" stroke-opacity="0.25" />
    <text x="20" y="58" fill="#61716b" font-family="'SFMono-Regular', Consolas, monospace" font-size="9" letter-spacing="2.4">PULSE STATUS</text>
    <text x="20" y="100" fill="#edf3ee" font-family="Inter, 'PingFang SC', sans-serif" font-size="30" font-weight="600" letter-spacing="-1">Always in sync.</text>
    <text x="20" y="124" fill="#8b9a94" font-family="Inter, 'PingFang SC', sans-serif" font-size="11">Incremental scans. Mirrored folders. Zero database.</text>
  </g>
</svg>
