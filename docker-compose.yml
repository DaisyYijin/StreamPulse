name: streampulse

services:
  streampulse:
    image: ${STREAMPULSE_IMAGE:-ghcr.io/daisyyijin/streampulse:latest}
    container_name: streampulse
    restart: unless-stopped
    ports:
      - "1024:1024"
      - "2048:2048"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: 1024
      STREAM_PORT: 2048
      # Optional: set a password to skip first-run setup. Leave empty to use
      # the browser setup screen.
      STREAMPULSE_PASSWORD: ${STREAMPULSE_PASSWORD:-}
      # Emby will request this address. Leave empty to auto-detect from the
      # browser's hostname when you create your first library.
      STREAM_PUBLIC_URL: ${STREAM_PUBLIC_URL:-}
      OUTPUT_DIR: ${OUTPUT_DIR:-/data/strm}
      # Set to true when StreamPulse is behind an HTTPS reverse proxy.
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      # Database, manifests and generated STRM files live together here.
      - ./data:/data
      # To write STRM files directly to an existing media share, uncomment
      # and set OUTPUT_DIR below:
      # - /volume1/media/strm:/media/strm
      # Then add OUTPUT_DIR: /media/strm to the environment block above.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "Promise.all([fetch('http://127.0.0.1:1024/api/health'),fetch('http://127.0.0.1:2048/health')]).then((rs)=>{if(rs.some((r)=>!r.ok))process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
