services:
  streampulse:
    image: ghcr.io/daisyijin/streampulse:latest
    container_name: streampulse
    restart: unless-stopped
    ports:
      - "1024:1024"
      - "2048:2048"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
      - ./config:/config
      - ./logs:/logs
      - ./media:/media
