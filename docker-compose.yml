name: streampulse

services:
  streampulse:
    image: ${STREAMPULSE_IMAGE:-ghcr.io/daisyyijin/streampulse:latest}
    container_name: streampulse
    restart: unless-stopped
    ports:
      - "1024:1024"
      - "2048:2048"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: 1024
      STREAM_PORT: 2048
      # Optional: set a password to skip first-run setup. Leave empty to use
      # the browser setup screen.
      STREAMPULSE_USERNAME: ${STREAMPULSE_USERNAME:-admin}
      STREAMPULSE_PASSWORD: ${STREAMPULSE_PASSWORD:-}
      # Emby will request this address. Leave empty to auto-detect from the
      # browser's hostname when you create your first library.
      STREAM_PUBLIC_URL: ${STREAM_PUBLIC_URL:-}
      CONFIG_DIR: ${CONFIG_DIR:-/config}
      STATE_DIR: ${STATE_DIR:-/data}
      IMPORT_DIR: ${IMPORT_DIR:-/import}
      MEDIA_DIR: ${MEDIA_DIR:-/media}
      OUTPUT_DIR: ${OUTPUT_DIR:-/strm}
      LOG_DIR: ${LOG_DIR:-/logs}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
      # Set to true when StreamPulse is behind an HTTPS reverse proxy.
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      # Settings, admin accounts, source accounts and library definitions.
      - ./config:/config
      # Runtime state: run history and per-library manifests.
      - ./data:/data
      # Local download inbox and organized local media for the organizer.
      - ./import:/import
      - ./media:/media
      # Generated .strm files. Map this directory into Emby / Jellyfin.
      - ./strm:/strm
      # Persistent application logs, rotated daily.
      - ./logs:/logs
      # To write STRM files directly to an existing media share instead,
      # replace ./strm:/strm with the host path and set OUTPUT_DIR.
      # - /volume1/media/strm:/media/strm
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "Promise.all([fetch('http://127.0.0.1:1024/api/health'),fetch('http://127.0.0.1:2048/health')]).then((rs)=>{if(rs.some((r)=>!r.ok))process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
