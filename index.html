<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f6f1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="StreamPulse — 把 OpenList 云盘媒体生成标准 STRM 媒体库，供 Emby 与 Jellyfin 原生播放。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StreamPulse" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <title>StreamPulse · STRM 媒体库引擎</title>
  </head>
  <body>
    <script>
      try {
        var theme = localStorage.getItem('sp-theme') || 'light';
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#080b0a' : '#f3f6f1');
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
